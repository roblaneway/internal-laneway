# Local Postgres for development: `npm run db:up`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laneway
    ports:
      - "5433:5432"
    volumes:
      - laneway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laneway"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  laneway-db:
